name: CAS
options:
  bundleIdPrefix: com.monclar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CAS:
    type: application
    platform: iOS
    sources:
      - path: CAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monclar.cas
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CAS
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  CASTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CASTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CAS
schemes:
  CAS:
    build:
      targets:
        CAS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CASTests
